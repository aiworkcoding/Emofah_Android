name: Build Emofah Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build, Verify & Package Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
        shell: bash

    steps:
      # =========================================================================
      # STAGE 1: Checkout
      # =========================================================================
      - name: "Stage 1: Checkout repository"
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # =========================================================================
      # STAGE 2: Java Setup & Verification
      # =========================================================================
      - name: "Stage 2: Set up JDK 17 (Temurin)"
        id: setup_java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: "Stage 2b: Verify Java 17 toolchain"
        id: verify_java
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 2: Java Setup" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=JAVA_VERSION_MISMATCH" >> "$GITHUB_ENV"

          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "ERROR: [JAVA_VERSION_MISMATCH] JAVA_HOME is missing or invalid: ${JAVA_HOME:-<unset>}"
            exit 1
          fi

          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          echo "Detected Java: $JAVA_VER_LINE (JAVA_HOME=$JAVA_HOME)"
          if ! echo "$JAVA_VER_LINE" | grep -qE '"17\.'; then
            echo "ERROR: [JAVA_VERSION_MISMATCH] Expected JDK 17, got: $JAVA_VER_LINE"
            exit 1
          fi

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 3: Gradle Setup & Wrapper Integrity
      # =========================================================================
      - name: "Stage 3: Configure Gradle caching & wrapper validation"
        id: setup_gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-cleanup: on-success
          add-job-summary: always

      # =========================================================================
      # STAGE 4: Android SDK Command-Line Tools & Licences
      # =========================================================================
      - name: "Stage 4a: Set up Android SDK command-line tools"
        id: setup_android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'
          packages: ''

      - name: "Stage 4b: Verify Android SDK licences"
        id: verify_licenses
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 4: SDK Licence Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=SDK_LICENSE_FAILURE" >> "$GITHUB_ENV"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "FAILURE_CATEGORY=SDK_SETUP_FAILURE" >> "$GITHUB_ENV"
            echo "ERROR: [SDK_SETUP_FAILURE] ANDROID_SDK_ROOT is not set or directory does not exist."
            exit 1
          fi

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "FAILURE_CATEGORY=SDK_SETUP_FAILURE" >> "$GITHUB_ENV"
            echo "ERROR: [SDK_SETUP_FAILURE] sdkmanager not found on PATH."
            exit 1
          fi

          printf 'y\n%.0s' {1..50} | sdkmanager --licenses >/dev/null || {
            echo "ERROR: [SDK_LICENSE_FAILURE] Failed to accept Android SDK licences."
            exit 1
          }

          if [ ! -s "$SDK_ROOT/licenses/android-sdk-license" ]; then
            echo "ERROR: [SDK_LICENSE_FAILURE] $SDK_ROOT/licenses/android-sdk-license missing or empty."
            exit 1
          fi
          echo "SUCCESS: Android SDK licences verified."

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 5: Gradle Preflight & Authoritative Project Metadata Discovery
      # =========================================================================
      - name: "Stage 5: Preflight Gradle wrapper, project structure & authoritative metadata"
        id: preflight
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 5: Gradle Wrapper & Preflight Validation" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=GRADLE_WRAPPER_FAILURE" >> "$GITHUB_ENV"

          for f in gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml \
            ../.github/scripts/gradle-with-retry.sh ../.github/scripts/install-sdk.sh ../.github/scripts/verify-apk.sh ../.github/scripts/verify-test-results.py; do
            if [ ! -f "$f" ]; then
              echo "ERROR: [GRADLE_WRAPPER_FAILURE] Required file missing: $f"
              exit 1
            fi
          done

          if ! command -v python3 >/dev/null 2>&1; then
            echo "ERROR: [GRADLE_WRAPPER_FAILURE] Required tool 'python3' missing on runner PATH."
            exit 1
          fi

          if ! grep -q "org.gradle.wrapper.GradleWrapperMain" gradlew; then
            echo "ERROR: [GRADLE_WRAPPER_FAILURE] android/gradlew is not a genuine Gradle wrapper script."
            exit 1
          fi

          chmod +x gradlew ../.github/scripts/*.sh ../.github/scripts/*.py

          WRAPPER_OUT=$(./gradlew --version --no-daemon --console=plain)
          echo "$WRAPPER_OUT"
          if ! echo "$WRAPPER_OUT" | grep -q "Gradle 8.9"; then
            echo "ERROR: [GRADLE_WRAPPER_FAILURE] Expected Gradle 8.9 from wrapper."
            exit 1
          fi
          if ! echo "$WRAPPER_OUT" | grep -qE "JVM:\s+17\.|Launcher JVM:\s+17\."; then
            echo "FAILURE_CATEGORY=JAVA_VERSION_MISMATCH" >> "$GITHUB_ENV"
            echo "ERROR: [JAVA_VERSION_MISMATCH] Gradle wrapper is not running on JDK 17."
            exit 1
          fi

          if [ -n "${SUPABASE_URL:-}" ] && [[ ! "$SUPABASE_URL" =~ ^https:// ]]; then
            echo "FAILURE_CATEGORY=PROJECT_CONFIGURATION_FAILURE" >> "$GITHUB_ENV"
            echo "ERROR: [PROJECT_CONFIGURATION_FAILURE] vars.SUPABASE_URL must start with https://"
            exit 1
          fi
          if [ -n "${CLOUD_RECOGNITION_URL:-}" ] && [[ ! "$CLOUD_RECOGNITION_URL" =~ ^https:// ]]; then
            echo "FAILURE_CATEGORY=PROJECT_CONFIGURATION_FAILURE" >> "$GITHUB_ENV"
            echo "ERROR: [PROJECT_CONFIGURATION_FAILURE] vars.CLOUD_RECOGNITION_URL must start with https://"
            exit 1
          fi

          echo "FAILURE_CATEGORY=PROJECT_CONFIGURATION_FAILURE" >> "$GITHUB_ENV"
          META_OUT=$(./gradlew -q :app:printAppMetadata --no-daemon --console=plain)
          echo "$META_OUT"

          APP_ID=$(printf '%s\n' "$META_OUT" | awk -F= '/^APPLICATION_ID=/{print $2}')
          APP_VERSION_CODE=$(printf '%s\n' "$META_OUT" | awk -F= '/^VERSION_CODE=/{print $2}')
          APP_VERSION_NAME=$(printf '%s\n' "$META_OUT" | awk -F= '/^VERSION_NAME=/{print $2}')
          APP_COMPILE_SDK=$(printf '%s\n' "$META_OUT" | awk -F= '/^COMPILE_SDK=/{print $2}')
          APP_TARGET_SDK=$(printf '%s\n' "$META_OUT" | awk -F= '/^TARGET_SDK=/{print $2}')
          APP_MIN_SDK=$(printf '%s\n' "$META_OUT" | awk -F= '/^MIN_SDK=/{print $2}')

          if [ -z "$APP_ID" ] || [ -z "$APP_VERSION_CODE" ] || [ "$APP_VERSION_CODE" -le 0 ] 2>/dev/null || [ -z "$APP_VERSION_NAME" ] || [ -z "$APP_COMPILE_SDK" ]; then
            echo "ERROR: [PROJECT_CONFIGURATION_FAILURE] Invalid Gradle metadata from :app:printAppMetadata"
            exit 1
          fi

          {
            echo "APP_ID=$APP_ID"
            echo "APP_VERSION_CODE=$APP_VERSION_CODE"
            echo "APP_VERSION_NAME=$APP_VERSION_NAME"
            echo "APP_COMPILE_SDK=$APP_COMPILE_SDK"
            echo "APP_TARGET_SDK=$APP_TARGET_SDK"
            echo "APP_MIN_SDK=$APP_MIN_SDK"
          } >> "$GITHUB_ENV"

          PROJECTS_OUT=$(./gradlew projects --no-daemon --console=plain)
          echo "$PROJECTS_OUT"
          if ! grep -Fq "Project ':app'" <<< "$PROJECTS_OUT"; then
            echo "ERROR: [GRADLE_WRAPPER_FAILURE] Expected module ':app' not found in Gradle projects."
            exit 1
          fi

          tasks_file=$(mktemp)
          ./gradlew :app:tasks --all --no-daemon --console=plain > "$tasks_file"
          for expected_task in assembleDebug compileDebugKotlin compileDebugJavaWithJavac testDebugUnitTest; do
            if ! grep -Eq "(^|[[:space:]])${expected_task}([[:space:]]|$)" "$tasks_file"; then
              echo "ERROR: [GRADLE_WRAPPER_FAILURE] Expected task '$expected_task' not found in :app."
              rm -f "$tasks_file"
              exit 1
            fi
          done
          rm -f "$tasks_file"

          echo "SUCCESS: Preflight validation passed (appId=$APP_ID, v=$APP_VERSION_NAME+$APP_VERSION_CODE, compileSdk=$APP_COMPILE_SDK)."
          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 6: Dynamic SDK Package Installation & Verification
      # =========================================================================
      - name: "Stage 6: Install & verify Android SDK packages (compileSdk ${{ env.APP_COMPILE_SDK }})"
        id: verify_sdk_packages
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 6: SDK Dependency Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=SDK_SETUP_FAILURE" >> "$GITHUB_ENV"

          ../.github/scripts/install-sdk.sh "$APP_COMPILE_SDK"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 7: Gradle Dependency Resolution (Separate Valid Configurations)
      # =========================================================================
      - name: "Stage 7: Resolve Debug runtime & unit-test dependency configurations"
        id: resolve_deps
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 7: Gradle Dependency Resolution" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=GRADLE_DEPENDENCY_FAILURE" >> "$GITHUB_ENV"

          echo "--- Resolving :app debugRuntimeClasspath ---"
          ../.github/scripts/gradle-with-retry.sh :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain >/dev/null

          echo "--- Resolving :app debugUnitTestRuntimeClasspath ---"
          ../.github/scripts/gradle-with-retry.sh :app:dependencies --configuration debugUnitTestRuntimeClasspath --no-daemon --console=plain >/dev/null

          echo "SUCCESS: Both debugRuntimeClasspath and debugUnitTestRuntimeClasspath resolved cleanly."
          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 8: Android Compilation & Stale Output Cleanup
      # =========================================================================
      - name: "Stage 8: Clean stale APK outputs, record build timestamp & compile Debug sources"
        id: compile_android
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
          COMPILATION_STAGE_LABEL: "Stage 8: Android Compilation"
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 8: Android Compilation" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=PROJECT_COMPILATION_FAILURE" >> "$GITHUB_ENV"

          rm -rf app/build/outputs/apk/debug app/build/test-results/testDebugUnitTest
          BUILD_START_EPOCH=$(date +%s)
          echo "BUILD_START_EPOCH=$BUILD_START_EPOCH" >> "$GITHUB_ENV"

          ../.github/scripts/gradle-with-retry.sh :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --console=plain --stacktrace

          echo "SUCCESS: Debug Kotlin & Java compilation succeeded."
          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 9: Project Verification (Unit Tests)
      # =========================================================================
      - name: "Stage 9: Run unit tests & verify JUnit XML reports"
        id: unit_tests
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
          COMPILATION_STAGE_LABEL: "Stage 9: Unit Test Compilation"
          UNIT_TEST_STAGE_LABEL: "Stage 9: Project Verification (Unit Tests)"
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 9: Project Verification (Unit Tests)" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=GRADLE_EXECUTION_FAILURE" >> "$GITHUB_ENV"

          set +e
          ../.github/scripts/gradle-with-retry.sh :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
          gradle_rc=$?
          python3 ../.github/scripts/verify-test-results.py "app/build/test-results/testDebugUnitTest"
          verify_rc=$?
          set -e

          if [ "$verify_rc" -ne 0 ]; then
            if [ "$verify_rc" -eq 1 ]; then
              echo "FAILED_STAGE=Stage 9: Project Verification (Unit Tests)" >> "$GITHUB_ENV"
              echo "FAILURE_CATEGORY=UNIT_TEST_FAILURE" >> "$GITHUB_ENV"
            elif [ "$gradle_rc" -eq 0 ]; then
              echo "FAILED_STAGE=Stage 9: Test Report Verification" >> "$GITHUB_ENV"
              echo "FAILURE_CATEGORY=TEST_REPORT_VERIFICATION_FAILURE" >> "$GITHUB_ENV"
            else
              echo "FAILED_STAGE=Stage 9: Project Verification (Unit Tests)" >> "$GITHUB_ENV"
            fi
            if [ "$gradle_rc" -ne 0 ]; then
              exit "$gradle_rc"
            fi
            exit "$verify_rc"
          fi

          if [ "$gradle_rc" -ne 0 ]; then
            echo "ERROR: [GRADLE_EXECUTION_FAILURE] Unit test task exited with code $gradle_rc." >&2
            exit "$gradle_rc"
          fi

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 10: APK Generation
      # =========================================================================
      - name: "Stage 10: Assemble Debug APK"
        id: assemble_apk
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
          COMPILATION_STAGE_LABEL: "Stage 10: Android Compilation"
          APK_STAGE_LABEL: "Stage 10: APK Generation"
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 10: APK Generation" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=APK_GENERATION_FAILURE" >> "$GITHUB_ENV"

          ../.github/scripts/gradle-with-retry.sh :app:assembleDebug --no-daemon --console=plain --stacktrace

          echo "SUCCESS: assembleDebug completed."
          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 11: Independent APK Integrity & Metadata Verification
      # =========================================================================
      - name: "Stage 11: Verify Debug APK freshness, archive, metadata & signature"
        id: verify_apk
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 11: APK Integrity Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=APK_VALIDATION_FAILURE" >> "$GITHUB_ENV"

          ../.github/scripts/verify-apk.sh \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "$APP_ID" \
            "$APP_VERSION_CODE" \
            "$APP_VERSION_NAME" \
            "$BUILD_START_EPOCH"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 12: Artifact Upload (+ Test Diagnostics on Failure)
      # =========================================================================
      - name: "Stage 12a: Upload verified Debug APK artifact"
        id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emofah-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: "Stage 12b: Verify artifact upload digest & outputs"
        id: verify_upload
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 12: Artifact Upload Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=ARTIFACT_PUBLICATION_FAILURE" >> "$GITHUB_ENV"

          if [ -z "${{ steps.upload_apk.outputs.artifact-id }}" ]; then
            echo "ERROR: [ARTIFACT_PUBLICATION_FAILURE] upload-artifact did not emit an artifact-id."
            exit 1
          fi
          echo "Uploaded artifact ID: ${{ steps.upload_apk.outputs.artifact-id }}"
          echo "Artifact digest: ${{ steps.upload_apk.outputs.artifact-digest }}"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      - name: "Stage 12c: Upload unit test report on failure"
        id: upload_test_reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emofah-android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      # =========================================================================
      # STAGE 13: Build Summary
      # =========================================================================
      - name: "Stage 13: Write Build & Diagnostics Summary"
        id: build_summary
        if: always()
        run: |
          {
            echo "## Emofah Android Debug APK — Build Report"
            echo ""
            echo "- **Overall Status:** \`${{ job.status }}\`"
            echo "- **Commit:** \`${{ github.sha }}\` (\`${{ github.ref_name }}\`)"
            if [ "${{ job.status }}" != "success" ]; then
              echo "- **Failed Stage:** \`${FAILED_STAGE:-Unknown (inspect step logs)}\`"
              echo "- **Diagnostic Category:** \`${FAILURE_CATEGORY:-UNCLASSIFIED_FAILURE}\`"
            fi
            echo ""
            echo "| Stage | Result |"
            echo "| :--- | :--- |"
            echo "| 1. Checkout | \`${{ steps.checkout.outcome }}\` |"
            echo "| 2. Java 17 Setup & Verify | \`${{ steps.setup_java.outcome }}\` / \`${{ steps.verify_java.outcome }}\` |"
            echo "| 3. Gradle Setup & Wrapper Validation | \`${{ steps.setup_gradle.outcome }}\` |"
            echo "| 4. SDK Tools & Licences | \`${{ steps.setup_android.outcome }}\` / \`${{ steps.verify_licenses.outcome }}\` |"
            echo "| 5. Preflight & Metadata (\`compileSdk ${APP_COMPILE_SDK:-?}\`) | \`${{ steps.preflight.outcome }}\` |"
            echo "| 6. SDK Packages (\`build-tools ${ANDROID_BUILD_TOOLS_VERSION:-?}\`) | \`${{ steps.verify_sdk_packages.outcome }}\` |"
            echo "| 7. Dependency Resolution | \`${{ steps.resolve_deps.outcome }}\` |"
            echo "| 8. Android Compilation | \`${{ steps.compile_android.outcome }}\` |"
            echo "| 9. Unit Tests (\`${UNIT_TEST_CASES:-0}\` cases / \`${UNIT_TEST_SUITES:-0}\` suites, \`${UNIT_TEST_FAILURES:-0}\` failed / \`${UNIT_TEST_ERRORS:-0}\` errors) | \`${{ steps.unit_tests.outcome }}\` |"
            echo "| 10. APK Generation (assembleDebug) | \`${{ steps.assemble_apk.outcome }}\` |"
            echo "| 11. APK Integrity Verification | \`${{ steps.verify_apk.outcome }}\` |"
            echo "| 12. Artifact Upload & Check | \`${{ steps.upload_apk.outcome }}\` / \`${{ steps.verify_upload.outcome }}\` |"
            if [ "${{ steps.verify_apk.outcome }}" = "success" ]; then
              echo ""
              echo "### Verified Debug APK Details"
              echo "- **Artifact Name:** \`emofah-android-debug\` (ID: \`${{ steps.upload_apk.outputs.artifact-id }}\`)"
              echo "- **Application ID:** \`${{ steps.verify_apk.outputs.apk_application_id }}\`"
              echo "- **Version:** \`${{ steps.verify_apk.outputs.apk_version_name }}\` (versionCode \`${{ steps.verify_apk.outputs.apk_version_code }}\`)"
              echo "- **Size:** \`${{ steps.verify_apk.outputs.apk_size_human }}\` (\`${{ steps.verify_apk.outputs.apk_size_bytes }}\` bytes)"
              echo "- **APK SHA-256:** \`${{ steps.verify_apk.outputs.apk_sha256 }}\`"
              echo "- **Debug Signer Cert SHA-256:** \`${{ steps.verify_apk.outputs.apk_cert_sha256 }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
