name: Build and Release Emofah Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build, Sign, Verify & Release Android Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
        shell: bash

    steps:
      # =========================================================================
      # STAGE 1: Checkout
      # =========================================================================
      - name: "Stage 1: Checkout repository"
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # =========================================================================
      # STAGE 2: Java Setup & Verification
      # =========================================================================
      - name: "Stage 2: Set up JDK 17 (Temurin)"
        id: setup_java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: "Stage 2b: Verify Java 17 toolchain"
        id: verify_java
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 2: Java Setup" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=JAVA_VERSION_MISMATCH" >> "$GITHUB_ENV"

          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "ERROR: [JAVA_VERSION_MISMATCH] JAVA_HOME is missing or invalid."
            exit 1
          fi

          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          echo "Detected Java: $JAVA_VER_LINE"
          if ! echo "$JAVA_VER_LINE" | grep -qE '"17\.'; then
            echo "ERROR: [JAVA_VERSION_MISMATCH] Expected JDK 17, got: $JAVA_VER_LINE"
            exit 1
          fi

          for tool in keytool jarsigner jar; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "ERROR: [JAVA_VERSION_MISMATCH] Required JDK tool '$tool' missing."
              exit 1
            fi
          done

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 3: Gradle Setup & Wrapper Validation
      # =========================================================================
      - name: "Stage 3: Configure Gradle caching & wrapper validation"
        id: setup_gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-cleanup: on-success
          add-job-summary: always

      # =========================================================================
      # STAGE 4: Android SDK Command-Line Tools & Licences
      # =========================================================================
      - name: "Stage 4a: Set up Android SDK command-line tools"
        id: setup_android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '14742923'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'
          packages: ''

      - name: "Stage 4b: Verify Android SDK licences"
        id: verify_licenses
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 4: SDK Licence Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=SDK_LICENSE_FAILURE" >> "$GITHUB_ENV"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ] || ! command -v sdkmanager >/dev/null 2>&1; then
            echo "FAILURE_CATEGORY=SDK_SETUP_FAILURE" >> "$GITHUB_ENV"
            echo "ERROR: [SDK_SETUP_FAILURE] Android SDK or sdkmanager missing."
            exit 1
          fi

          printf 'y\n%.0s' {1..50} | sdkmanager --licenses >/dev/null || {
            echo "ERROR: [SDK_LICENSE_FAILURE] Failed to accept Android SDK licences."
            exit 1
          }

          if [ ! -s "$SDK_ROOT/licenses/android-sdk-license" ]; then
            echo "ERROR: [SDK_LICENSE_FAILURE] android-sdk-license missing or empty."
            exit 1
          fi

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 5: Preflight Gradle Wrapper, Authoritative Metadata & Release Signing
      # =========================================================================
      - name: "Stage 5a: Preflight Gradle wrapper & authoritative metadata"
        id: preflight_gradle
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 5: Gradle Preflight" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=GRADLE_WRAPPER_FAILURE" >> "$GITHUB_ENV"

          for f in gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml \
            ../.github/scripts/gradle-with-retry.sh ../.github/scripts/install-sdk.sh ../.github/scripts/verify-apk.sh ../.github/scripts/verify-aab.sh ../.github/scripts/verify-release-signing-preflight.sh ../.github/scripts/verify-test-results.py; do
            if [ ! -f "$f" ]; then
              echo "ERROR: [GRADLE_WRAPPER_FAILURE] Required file missing: $f"
              exit 1
            fi
          done

          if ! command -v python3 >/dev/null 2>&1; then
            echo "ERROR: [GRADLE_WRAPPER_FAILURE] Required tool 'python3' missing on runner PATH."
            exit 1
          fi

          if ! grep -q "org.gradle.wrapper.GradleWrapperMain" gradlew; then
            echo "ERROR: [GRADLE_WRAPPER_FAILURE] android/gradlew is not a genuine Gradle wrapper script."
            exit 1
          fi
          chmod +x gradlew ../.github/scripts/*.sh ../.github/scripts/*.py

          WRAPPER_OUT=$(./gradlew --version --no-daemon --console=plain)
          echo "$WRAPPER_OUT"
          if ! echo "$WRAPPER_OUT" | grep -q "Gradle 8.9"; then
            echo "ERROR: [GRADLE_WRAPPER_FAILURE] Expected Gradle 8.9 from wrapper."
            exit 1
          fi
          if ! echo "$WRAPPER_OUT" | grep -qE "JVM:\s+17\.|Launcher JVM:\s+17\."; then
            echo "FAILURE_CATEGORY=JAVA_VERSION_MISMATCH" >> "$GITHUB_ENV"
            echo "ERROR: [JAVA_VERSION_MISMATCH] Gradle wrapper is not running on JDK 17."
            exit 1
          fi

          if [ -n "${SUPABASE_URL:-}" ] && [[ ! "$SUPABASE_URL" =~ ^https:// ]]; then
            echo "FAILURE_CATEGORY=PROJECT_CONFIGURATION_FAILURE" >> "$GITHUB_ENV"
            echo "ERROR: [PROJECT_CONFIGURATION_FAILURE] vars.SUPABASE_URL must start with https://"
            exit 1
          fi
          if [ -n "${CLOUD_RECOGNITION_URL:-}" ] && [[ ! "$CLOUD_RECOGNITION_URL" =~ ^https:// ]]; then
            echo "FAILURE_CATEGORY=PROJECT_CONFIGURATION_FAILURE" >> "$GITHUB_ENV"
            echo "ERROR: [PROJECT_CONFIGURATION_FAILURE] vars.CLOUD_RECOGNITION_URL must start with https://"
            exit 1
          fi

          echo "FAILURE_CATEGORY=PROJECT_CONFIGURATION_FAILURE" >> "$GITHUB_ENV"
          META_OUT=$(./gradlew -q :app:printAppMetadata --no-daemon --console=plain)
          echo "$META_OUT"

          APP_ID=$(printf '%s\n' "$META_OUT" | awk -F= '/^APPLICATION_ID=/{print $2}')
          APP_VERSION_CODE=$(printf '%s\n' "$META_OUT" | awk -F= '/^VERSION_CODE=/{print $2}')
          APP_VERSION_NAME=$(printf '%s\n' "$META_OUT" | awk -F= '/^VERSION_NAME=/{print $2}')
          APP_COMPILE_SDK=$(printf '%s\n' "$META_OUT" | awk -F= '/^COMPILE_SDK=/{print $2}')

          if [ -z "$APP_ID" ] || [ -z "$APP_VERSION_CODE" ] || [ "$APP_VERSION_CODE" -le 0 ] 2>/dev/null || [ -z "$APP_VERSION_NAME" ] || [ -z "$APP_COMPILE_SDK" ]; then
            echo "ERROR: [PROJECT_CONFIGURATION_FAILURE] Invalid Gradle metadata from :app:printAppMetadata"
            exit 1
          fi

          {
            echo "APP_ID=$APP_ID"
            echo "APP_VERSION_CODE=$APP_VERSION_CODE"
            echo "APP_VERSION_NAME=$APP_VERSION_NAME"
            echo "APP_COMPILE_SDK=$APP_COMPILE_SDK"
          } >> "$GITHUB_ENV"

          tasks_file=$(mktemp)
          ./gradlew :app:tasks --all --no-daemon --console=plain > "$tasks_file"
          for expected_task in assembleRelease bundleRelease compileReleaseKotlin compileReleaseJavaWithJavac testDebugUnitTest testReleaseUnitTest; do
            if ! grep -Eq "(^|[[:space:]])${expected_task}([[:space:]]|$)" "$tasks_file"; then
              echo "ERROR: [GRADLE_WRAPPER_FAILURE] Expected task '$expected_task' not found in :app."
              rm -f "$tasks_file"
              exit 1
            fi
          done
          rm -f "$tasks_file"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      - name: "Stage 5b: Mandatory release signing preflight (keystore, alias, storepass & keypass signing probe)"
        id: preflight_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 5b: Release Signing Preflight" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=RELEASE_SIGNING_FAILURE" >> "$GITHUB_ENV"

          ../.github/scripts/verify-release-signing-preflight.sh release.keystore

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 6: Dynamic SDK Package Installation & Verification
      # =========================================================================
      - name: "Stage 6: Install & verify Android SDK packages (compileSdk ${{ env.APP_COMPILE_SDK }})"
        id: verify_sdk_packages
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 6: SDK Dependency Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=SDK_SETUP_FAILURE" >> "$GITHUB_ENV"

          ../.github/scripts/install-sdk.sh "$APP_COMPILE_SDK"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 7: Gradle Dependency Resolution (Separate Valid Configurations)
      # =========================================================================
      - name: "Stage 7: Resolve Release runtime & unit-test dependency configurations"
        id: resolve_deps
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 7: Gradle Dependency Resolution" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=GRADLE_DEPENDENCY_FAILURE" >> "$GITHUB_ENV"

          echo "--- Resolving :app releaseRuntimeClasspath ---"
          ../.github/scripts/gradle-with-retry.sh :app:dependencies --configuration releaseRuntimeClasspath --no-daemon --console=plain >/dev/null

          echo "--- Resolving :app releaseUnitTestRuntimeClasspath ---"
          ../.github/scripts/gradle-with-retry.sh :app:dependencies --configuration releaseUnitTestRuntimeClasspath --no-daemon --console=plain >/dev/null

          echo "--- Resolving :app debugUnitTestRuntimeClasspath ---"
          ../.github/scripts/gradle-with-retry.sh :app:dependencies --configuration debugUnitTestRuntimeClasspath --no-daemon --console=plain >/dev/null

          echo "SUCCESS: All release and unit-test runtime classpaths resolved cleanly."
          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 8: Android Release Compilation & Stale Output Cleanup
      # =========================================================================
      - name: "Stage 8: Clean stale release outputs, record build timestamp & compile Release sources"
        id: compile_release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
          EMOFAH_REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          COMPILATION_STAGE_LABEL: "Stage 8: Android Release Compilation"
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 8: Android Release Compilation" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=PROJECT_COMPILATION_FAILURE" >> "$GITHUB_ENV"

          rm -rf app/build/outputs/apk/release app/build/outputs/bundle/release \
            app/build/test-results/testDebugUnitTest app/build/test-results/testReleaseUnitTest
          BUILD_START_EPOCH=$(date +%s)
          echo "BUILD_START_EPOCH=$BUILD_START_EPOCH" >> "$GITHUB_ENV"

          ../.github/scripts/gradle-with-retry.sh :app:compileReleaseKotlin :app:compileReleaseJavaWithJavac --no-daemon --console=plain --stacktrace

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 9: Project Verification (Unit Tests)
      # =========================================================================
      - name: "Stage 9: Run unit tests & verify JUnit XML reports"
        id: unit_tests
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
          COMPILATION_STAGE_LABEL: "Stage 9: Unit Test Compilation"
          UNIT_TEST_STAGE_LABEL: "Stage 9: Project Verification (Unit Tests)"
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 9: Project Verification (Unit Tests)" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=GRADLE_EXECUTION_FAILURE" >> "$GITHUB_ENV"

          ../.github/scripts/gradle-with-retry.sh :app:testDebugUnitTest :app:testReleaseUnitTest --no-daemon --console=plain --stacktrace

          set +e
          python3 ../.github/scripts/verify-test-results.py "app/build/test-results/testDebugUnitTest" "app/build/test-results/testReleaseUnitTest"
          verify_rc=$?
          set -e

          if [ "$verify_rc" -ne 0 ]; then
            if [ "$verify_rc" -eq 1 ]; then
              echo "FAILED_STAGE=Stage 9: Project Verification (Unit Tests)" >> "$GITHUB_ENV"
              echo "FAILURE_CATEGORY=UNIT_TEST_FAILURE" >> "$GITHUB_ENV"
            else
              echo "FAILED_STAGE=Stage 9: Test Report Verification" >> "$GITHUB_ENV"
              echo "FAILURE_CATEGORY=TEST_REPORT_VERIFICATION_FAILURE" >> "$GITHUB_ENV"
            fi
            exit "$verify_rc"
          fi

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 10: Signed Release APK & AAB Generation
      # =========================================================================
      - name: "Stage 10: Build signed Release APK & App Bundle"
        id: build_release_binaries
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUD_RECOGNITION_URL: ${{ vars.CLOUD_RECOGNITION_URL }}
          EMOFAH_REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          COMPILATION_STAGE_LABEL: "Stage 10: Android Release Compilation"
          APK_STAGE_LABEL: "Stage 10: Release APK & AAB Generation"
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 10: Release APK & AAB Generation" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=APK_GENERATION_FAILURE" >> "$GITHUB_ENV"

          ../.github/scripts/gradle-with-retry.sh :app:assembleRelease :app:bundleRelease --no-daemon --console=plain --stacktrace

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 11: Release Binary Integrity, Metadata & Identity Verification
      # =========================================================================
      - name: "Stage 11a: Verify signed Release APK integrity & identity"
        id: verify_release_apk
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 11a: Release APK Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=APK_VALIDATION_FAILURE" >> "$GITHUB_ENV"

          if [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "FAILURE_CATEGORY=RELEASE_SIGNING_FAILURE" >> "$GITHUB_ENV"
            echo "ERROR: [RELEASE_SIGNING_FAILURE] EXPECTED_CERT_SHA256 is missing from release signing preflight." >&2
            exit 1
          fi

          ../.github/scripts/verify-apk.sh \
            "app/build/outputs/apk/release/app-release.apk" \
            "$APP_ID" \
            "$APP_VERSION_CODE" \
            "$APP_VERSION_NAME" \
            "$BUILD_START_EPOCH" \
            "$EXPECTED_CERT_SHA256"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      - name: "Stage 11b: Verify signed Release AAB bundle validity, manifest & signer identity"
        id: verify_release_aab
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 11b: Release AAB Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=RELEASE_SIGNING_FAILURE" >> "$GITHUB_ENV"

          ../.github/scripts/verify-aab.sh \
            "app/build/outputs/bundle/release/app-release.aab" \
            "$APP_ID" \
            "$APP_VERSION_CODE" \
            "$APP_VERSION_NAME" \
            "$EXPECTED_CERT_SHA256" \
            "${{ steps.verify_release_apk.outputs.apk_cert_sha256 }}" \
            "$BUILD_START_EPOCH"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      # =========================================================================
      # STAGE 12: Artifact Upload, Failure Reports & Tag-Guarded GitHub Release
      # =========================================================================
      - name: "Stage 12a: Upload Release Artifacts"
        id: upload_release_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emofah-android-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: "Stage 12b: Verify Release artifact upload outputs"
        id: verify_upload
        run: |
          set -euo pipefail
          echo "FAILED_STAGE=Stage 12: Artifact Upload Verification" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=ARTIFACT_PUBLICATION_FAILURE" >> "$GITHUB_ENV"

          if [ -z "${{ steps.upload_release_artifacts.outputs.artifact-id }}" ]; then
            echo "ERROR: [ARTIFACT_PUBLICATION_FAILURE] upload-artifact did not emit an artifact-id."
            exit 1
          fi
          echo "Uploaded release artifact ID: ${{ steps.upload_release_artifacts.outputs.artifact-id }}"
          echo "Artifact digest: ${{ steps.upload_release_artifacts.outputs.artifact-digest }}"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CATEGORY=" >> "$GITHUB_ENV"

      - name: "Stage 12c: Create GitHub Release (tag pushes only)"
        id: github_release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Stage 12d: Upload unit test report on failure"
        id: upload_test_reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emofah-android-release-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/reports/tests/testReleaseUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: "Cleanup decoded keystore"
        if: always()
        run: rm -f release.keystore

      # =========================================================================
      # STAGE 13: Build Summary
      # =========================================================================
      - name: "Stage 13: Write Release Build Summary"
        id: build_summary
        if: always()
        run: |
          {
            echo "## Emofah Android Release Build Summary"
            echo ""
            echo "- **Overall Status:** \`${{ job.status }}\`"
            echo "- **Ref:** \`${{ github.ref }}\` (\`${{ github.sha }}\`)"
            if [ "${{ job.status }}" != "success" ]; then
              echo "- **Failed Stage:** \`${FAILED_STAGE:-Unknown (inspect step logs)}\`"
              echo "- **Diagnostic Category:** \`${FAILURE_CATEGORY:-UNCLASSIFIED_FAILURE}\`"
            fi
            if [ "${{ steps.verify_release_apk.outcome }}" = "success" ] && [ "${{ steps.verify_release_aab.outcome }}" = "success" ]; then
              echo ""
              echo "### Verified Signed Release Binaries"
              echo "- **Application ID:** \`${{ steps.verify_release_apk.outputs.apk_application_id }}\`"
              echo "- **Version:** \`${{ steps.verify_release_apk.outputs.apk_version_name }}\` (versionCode \`${{ steps.verify_release_apk.outputs.apk_version_code }}\`)"
              echo "- **Signed APK:** \`${{ steps.verify_release_apk.outputs.apk_size_human }}\` (\`${{ steps.verify_release_apk.outputs.apk_size_bytes }}\` bytes, SHA-256: \`${{ steps.verify_release_apk.outputs.apk_sha256 }}\`)"
              echo "- **Signed AAB:** \`${{ steps.verify_release_aab.outputs.aab_size_human }}\` (\`${{ steps.verify_release_aab.outputs.aab_size_bytes }}\` bytes, SHA-256: \`${{ steps.verify_release_aab.outputs.aab_sha256 }}\`)"
              echo "- **Signer Cert SHA-256:** \`${{ steps.verify_release_aab.outputs.aab_cert_sha256 }}\`"
              echo "- **Artifact ID:** \`${{ steps.upload_release_artifacts.outputs.artifact-id }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
